components:
  schemas:
    Attendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        gym:
          type: integer
          readOnly: true
        member:
          type: integer
        member_name:
          type: string
          readOnly: true
        member_code:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        check_in:
          type: string
          format: time
        check_out:
          type: string
          format: time
          nullable: true
        method:
          $ref: '#/components/schemas/MethodEnum'
        notes:
          type: string
          nullable: true
          maxLength: 255
        membership_status:
          type: string
          readOnly: true
      required:
      - gym
      - id
      - member
      - member_code
      - member_name
      - membership_status
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        gym:
          type: integer
          readOnly: true
          nullable: true
        user:
          type: integer
          readOnly: true
          nullable: true
        user_name:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        entity:
          type: string
          readOnly: true
        entity_id:
          type: string
          readOnly: true
          nullable: true
        metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - entity
      - entity_id
      - gym
      - id
      - metadata
      - user
      - user_name
    CategoryEnum:
      enum:
      - RENT
      - ELECTRICITY
      - EQUIPMENT
      - MAINTENANCE
      - SALARY
      - MARKETING
      - OTHER
      type: string
      description: |-
        * `RENT` - Gym Rent
        * `ELECTRICITY` - Electricity & Water
        * `EQUIPMENT` - Equipment & Repairs
        * `MAINTENANCE` - Facility Maintenance
        * `SALARY` - Staff & Trainer Salary
        * `MARKETING` - Marketing & Ads
        * `OTHER` - Other Expenses
    CustomTokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Expense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        gym:
          type: integer
          readOnly: true
        category:
          $ref: '#/components/schemas/CategoryEnum'
        category_display:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        expense_date:
          type: string
          format: date
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - category_display
      - created_at
      - gym
      - id
      - title
    GenderEnum:
      enum:
      - MALE
      - FEMALE
      - OTHER
      type: string
      description: |-
        * `MALE` - Male
        * `FEMALE` - Female
        * `OTHER` - Other
    Gym:
      type: object
      properties:
